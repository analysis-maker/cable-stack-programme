<style>
/* Layout: one-column phone app. Sticky tab bar, stack of exercise cards, each led by an animated mannequin on the cable machine, working muscles glowing. */
:root{
  --bg:#eceeea; --surface:#fbfcfa; --ink:#1b201e; --muted:#59645e; --line:#d3d8d2;
  --accent:#f0c419; --accent-ink:#1b201e; --go:#2f7d4a; --on-go:#ffffff; --chip:#e2e6e0;
  --stage1:#f6f8f5; --stage2:#e1e6e0; --tile1:#b7c4b2; --tile2:#d2d6cf;
  --col:#b4bcb7; --col-dark:#59625d; --body:#34403b; --body-far:#8a9690; --sheen:#6f7d77;
  --hot:#ff4f2b; --cable:#c99700;
  --display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --body-font:'Public Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201d; --ink:#e7ebe7; --muted:#9aa59e; --line:#2c332f;
  --accent:#f2cd2e; --accent-ink:#141714; --go:#5fbf7f; --on-go:#0f1511; --chip:#252b27;
  --stage1:#232a27; --stage2:#181d1b; --tile1:#2b3a2e; --tile2:#262b28;
  --col:#47504b; --col-dark:#2a302d; --body:#d6ddd9; --body-far:#6c7772; --sheen:#ffffff;
  --hot:#ff6a47; --cable:#f2cd2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --ink:#e7ebe7; --muted:#9aa59e; --line:#2c332f;
  --accent:#f2cd2e; --accent-ink:#141714; --go:#5fbf7f; --on-go:#0f1511; --chip:#252b27;
  --stage1:#232a27; --stage2:#181d1b; --tile1:#2b3a2e; --tile2:#262b28;
  --col:#47504b; --col-dark:#2a302d; --body:#d6ddd9; --body-far:#6c7772; --sheen:#ffffff;
  --hot:#ff6a47; --cable:#f2cd2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{width:64px;height:64px;flex:none;border-radius:15px}
header .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;margin:4px 0 0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 span{background:var(--accent);color:var(--accent-ink);padding:0 5px}
.sub{color:var(--muted);margin:14px 0 16px;font-size:14px}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.weeks button{font:700 13px var(--mono);padding:10px 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeknote{font-size:13px;color:var(--muted);margin:8px 0 0}
.weeknote b{color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line)}
nav.tabs a{text-decoration:none;color:var(--ink);text-align:center;padding:8px 2px 7px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a strong{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
nav.tabs a small{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs a[aria-current="page"] small{color:var(--accent-ink)}
.dayhead{margin:18px 0 12px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.dayhead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.demo{position:relative;cursor:pointer;border-bottom:1px solid var(--line);background:var(--stage2)}
.demo svg{display:block;width:100%;height:auto}
.demo video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#000}
.demo.real svg,.demo.real .phase{display:none}
.demo:not(.real) video{display:none}
.modebtn{font:600 11px var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 10px;cursor:pointer}
.democap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font:600 11px var(--mono);color:var(--muted);background:var(--stage2)}
[hidden]{display:none!important}
.demo .phase{position:absolute;font:700 11px var(--mono);left:50%;transform:translateX(-50%);top:9px;white-space:nowrap;background:var(--hot);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;font-size:10px}
.cbody{padding:14px 14px 16px;display:grid;gap:10px}
.cbody h3{margin:0;font-size:18px;line-height:1.25;font-weight:700}
.muscles{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.muscles i{width:8px;height:8px;border-radius:50%;background:var(--hot);display:inline-block}
.rx .big{font:700 22px var(--mono);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.setup{font-size:13.5px;margin:0}
ul.cues{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.vid{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;justify-self:start}
.vid::before{content:"";width:0;height:0;border-left:8px solid var(--hot);border-top:5px solid transparent;border-bottom:5px solid transparent}
.log{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:700 14px var(--mono);cursor:pointer}
.dot.on{background:var(--go);border-color:var(--go);color:var(--on-go)}
.row2{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.row2 input{flex:1 1 160px;min-width:0;font:500 14px var(--body-font);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{font:600 13px var(--body-font);padding:10px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
.hint{font-size:12px;color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,.demo:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0 0 8px;line-height:1}
.panel p,.panel li{font-size:14px}
.panel ul{padding-left:18px;margin:0;display:grid;gap:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.k{font-weight:700;white-space:nowrap}
.src a{color:var(--ink)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .t{font:700 30px var(--mono);font-variant-numeric:tabular-nums}
.timer .lb{font-size:12px;opacity:.75}
.timer button{font:600 13px var(--body-font);padding:9px 14px;border-radius:8px;border:1px solid var(--bg);background:transparent;color:var(--bg);cursor:pointer}
.timer.done{background:var(--go);color:var(--on-go)}
.timer.done button{border-color:var(--on-go);color:var(--on-go)}
</style>

  host.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  const [u0,p0]=phaseAt(tl,d.t/1000);d.draw(u0,p0);demos.push(d);
}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){demos.forEach(d=>{if(d.last!=null&&!d.paused){d.t+=now-d.last;const [u,ph]=phaseAt(d.tl,d.t/1000);d.draw(u,ph)}d.last=now});requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- day view ---------- */
const view=document.getElementById('view');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderDay(k){
  const D=DAYS[k];demos=[];
  const setsFor=n=>S.week===1?2:n;
  let h='<div class="dayhead"><h2>'+D.title+'</h2><p>'+D.day+' · '+D.focus+' · about 45-60 min · Week '+S.week+'</p></div><div class="cards">';
  D.list.forEach(([id,sets,reps,rest],i)=>{
    const ex=EX[id],n=setsFor(sets),key='w'+S.week+'-'+k+'-'+id,prev=S.log['w'+(S.week-1)+'-'+k+'-'+id];
    const L=S.log[key]||{};
    let dots='';for(let j=0;j<n;j++)dots+='<button type="button" class="dot'+(L.d&&L.d[j]?' on':'')+'" data-k="'+key+'" data-j="'+j+'" aria-label="Set '+(j+1)+' done">'+(j+1)+'</button>';
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.name+' proper form');
    h+='<article class="card"><div class="demo" tabindex="0" data-id="'+id+'"><span class="phase"></span>'+(VIDS.has(id)?'<video src="clips/'+id+'.mp4" poster="clips/'+id+'.jpg" muted loop playsinline autoplay preload="metadata" aria-label="'+esc(ex.name)+' video demo"></video>':'')+'<div class="democap"><span>'+(i+1)+' of '+D.list.length+'</span>'+(VIDS.has(id)?'<button type="button" class="modebtn">'+(S.mode==='real'?'Show animation':'Show video')+'</button>':'')+'<span class="play">'+(REDUCE?'Tap to play':'Tap to pause')+'</span></div></div>'+
     '<div class="cbody"><div><h3>'+esc(ex.name)+'</h3><div class="muscles"><i></i>'+esc(ex.mus)+'</div></div>'+
     '<div class="rx"><span class="big">'+n+' × '+reps+'</span></div>'+
     '<div class="pills"><span class="pill">'+ex.pulley+'</span><span class="pill">'+ex.att+'</span><span class="pill">Rest '+rest+'s</span></div>'+
     '<p class="setup">'+esc(ex.setup)+'</p><ul class="cues">'+ex.cues.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>'+
     '<a class="vid" href="'+yt+'" target="_blank" rel="noopener">Watch real-person demos</a>'+
     '<div class="log"><div class="dots"><span class="lbl">Sets</span>'+dots+'</div>'+
     '<div class="row2"><input id="in-'+k+'-'+id+'" data-k="'+key+'" value="'+esc(L.kg||'')+'" placeholder="Stack weight, notch #, notes" aria-label="Weight log for '+esc(ex.name)+'">'+
     '<button type="button" class="btn" data-rest="'+rest+'" data-name="'+esc(ex.name)+'">Rest '+rest+'s</button></div>'+
     (prev&&prev.kg?'<div class="hint">Last week: '+esc(prev.kg)+'</div>':'')+'</div></div></article>';
  });
  h+='</div>';view.innerHTML=h;
  view.querySelectorAll('.demo').forEach(x=>buildDemo(x.dataset.id,x));
  const applyMode=()=>view.querySelectorAll('.demo').forEach(x=>{const v=x.querySelector('video');if(!v)return;const real=S.mode==='real';x.classList.toggle('real',real);x.querySelector('.modebtn').textContent=real?'Show animation':'Show video';if(real&&!REDUCE)v.play().catch(()=>{});else v.pause()});
  applyMode();
  view.querySelectorAll('.modebtn').forEach(b=>b.onclick=e=>{e.stopPropagation();S.mode=S.mode==='real'?'anim':'real';save();applyMode()});
  view.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{const k2=b.dataset.k,j=+b.dataset.j;const L=S.log[k2]=S.log[k2]||{};L.d=L.d||[];L.d[j]=!L.d[j];b.classList.toggle('on',L.d[j]);save();
    if(L.d[j]){const rb=b.closest('.card').querySelector('[data-rest]');startTimer(+rb.dataset.rest,rb.dataset.name)}});
  view.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{const L=S.log[inp.dataset.k]=S.log[inp.dataset.k]||{};L.kg=inp.value;save()});
  view.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest,b.dataset.name));
}

/* ---------- plan view ---------- */

/* ---------- rest timer ---------- */
const tEl=document.getElementById('timer'),tVal=document.getElementById('tval'),tLab=document.getElementById('tlabel');
let tEnd=0,tInt=null;
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.value=.15;o.start();o.stop(A.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,name){
  clearInterval(tInt);tEnd=Date.now()+sec*1000;tEl.hidden=false;tEl.classList.remove('done');tLab.textContent='Rest · '+name;tVal.textContent=fmt(sec);
  tInt=setInterval(()=>{const left=(tEnd-Date.now())/1000;tVal.textContent=fmt(left);if(left<=0){clearInterval(tInt);tEl.classList.add('done');tLab.textContent='Go · next set';tVal.textContent='0:00';beep();setTimeout(()=>{if(tEl.classList.contains('done'))tEl.hidden=true},6000)}},250);
}
document.getElementById('tstop').onclick=()=>{clearInterval(tInt);tEl.hidden=true};

/* ---------- routing ---------- */
function defaultTab(){const d=new Date().getDay();return d===3?'b':d===5?'c':'a'}
function route(){
  let k=(location.hash||'').slice(1);if(!['a','b','c','plan'].includes(k))k=defaultTab();
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(k==='plan')renderPlan();else renderDay(k);
}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:document.getElementById('tabs').offsetTop-4})});
renderWeeks();route();
})();
